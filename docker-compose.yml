services:
  reverse-geocoder:
    build:
      context: .
    container_name: dawarich-reverse-geocoder
    user: "568:568"
    ports:
      - "2322:2322"
    environment:
      HOST: "0.0.0.0"
      PORT: "2322"
      GPKG_FILE: "/datasets/gadm_410.gpkg"
      GPKG_LAYER: "gadm_410"
      GPKG_CACHE_MODE: "country"
      GPKG_CACHE_MAX_TILES: "20"
      GPKG_CACHE_TTL_SECONDS: "86400"
      API_KEY: "change-me"
      API_KEY_HEADER: "X-API-Key"
    volumes:
      - "./datasets:/datasets:ro"
    restart: unless-stopped
