services:
  reverse-geocoder:
    build:
      context: .
    container_name: dawarich-reverse-geocoder
    ports:
      - "2322:2322"
    environment:
      HOST: "0.0.0.0"
      PORT: "2322"
      GPKG_FILE: "/datasets/gadm_410.gpkg"
      #GPKG_LAYER: "ADM_ADM_4"
      API_KEY: "change-me-local-key"
      API_KEY_HEADER: "X-API-Key"
    volumes:
      - "./datasets:/datasets:ro"
    restart: unless-stopped
